<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستەمی بەڕێوەبردنی مخزن و شت هێنان</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        nav button {
            flex: 1;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        nav button:hover, nav button.active {
            background-color: #2980b9;
        }

        .tab-content {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button.btn-action {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button.btn-action:hover {
            background-color: #27ae60;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
        }

        .recommendation {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h2>سیستەمی بەڕێوەبردنی کۆگا و کڕین (مخزن)</h2>
    </header>

    <nav>
        <button class="active" onclick="openTab('purchase-tab', this)">بەشی شت هێنان</button>
        <button onclick="openTab('inventory-tab', this)">بەشی مخزن</button>
        <button onclick="openTab('backup-tab', this)">باكه‌پ و گه‌ڕاندنه‌وه‌</button>
    </nav>

    <!-- 1. بەشی شت هێنان -->
    <div id="purchase-tab" class="tab-content active">
        <h3>کڕین و وەگرتنی کاڵا</h3>
        
        <div class="recommendation" id="low-stock-alert">
            <strong>پێشنیاری کڕین:</strong> هیچ کاڵایەک لە ئاستی مەترسیداردا نییە.
        </div>

        <div class="form-group">
            <label>گەڕان یان هەڵبژاردنی دوکاندار:</label>
            <input type="text" id="supplier-search" placeholder="ناوی دوکاندار بنووسە..." oninput="filterSuppliers()">
            <select id="supplier-select" style="margin-top: 5px;">
                <option value="">-- دوکاندارێک هەڵبژێرە --</option>
                <option value="شێرکۆ">دوکانی شێرکۆ</option>
                <option value="ئاریان">کۆمپانیای ئاریان</option>
                <option value="کاروان">کۆگای کاروان</option>
            </select>
        </div>

        <div class="form-group">
            <label>گەڕان بەدوای کاڵا:</label>
            <select id="product-select">
                <option value="">-- کاڵا هەڵبژێرە --</option>
            </select>
        </div>

        <div class="form-group">
            <label>بڕی هاتنی کاڵا (ژمارە):</label>
            <input type="number" id="purchase-qty" min="1" value="1">
        </div>

        <button class="btn-action" onclick="addStock()">تۆمارکردن و زیادکردن بۆ مخزن</button>
    </div>

    <!-- 2. بەشی مخزن -->
    <div id="inventory-tab" class="tab-content">
        <h3>زیادکردنی کاڵای نوێ</h3>
        <div class="form-group">
            <label>ناوی کاڵا:</label>
            <input type="text" id="new-item-name" placeholder="ناوی کاڵا">
        </div>
        <div class="form-group">
            <label>بڕی سەرەتایی:</label>
            <input type="number" id="new-item-qty" min="0" value="0">
        </div>
        <div class="form-group">
            <label>وێنەی کاڵا (بە شێوەی لینک/URL):</label>
            <input type="text" id="new-item-img" placeholder="https://example.com/image.jpg">
        </div>
        <button class="btn-action" onclick="addNewProduct()">زیادکردنی کاڵا</button>

        <hr style="margin: 20px 0;">

        <h3>لیستی کاڵاکانی کۆگا</h3>
        <table>
            <thead>
                <tr>
                    <th>وێنە</th>
                    <th>ناوی کاڵا</th>
                    <th>بڕی ناو مخزن</th>
                </tr>
            </thead>
            <tbody id="inventory-list">
                <!-- ژمارەی کاڵاکان لێرە دەردەکەون -->
            </tbody>
        </table>
    </div>

    <!-- 3. بەشی باکەپ -->
    <div id="backup-tab" class="tab-content">
        <h3>دروستکردن و گەڕاندنەوەی باکەپ</h3>
        <br>
        <button class="btn-action" onclick="downloadBackup()">داگرتنی باکەپ (JSON)</button>
        <br><br>
        <hr>
        <br>
        <div class="form-group">
            <label>گەڕاندنەوەی باکەپ لە ڕێگەی فایل:</label>
            <input type="file" id="restore-file" accept=".json">
        </div>
        <button class="btn-action" style="background-color: #e67e22;" onclick="restoreBackup()">گەڕاندنەوەی زانیارییەکان</button>
    </div>

    <script>
        // داتای ئامادەکراوی سەرەتایی (Data Base)
        let inventory = JSON.parse(localStorage.getItem('sys_inventory')) || [
            { id: 1, name: "کێک", qty: 5, img: "https://via.placeholder.com/50" },
            { id: 2, name: "بەقڵاوە", qty: 2, img: "https://via.placeholder.com/50" }
        ];

        // ڕێنیشاندانی تابەکان (Tab Navigation)
        function openTab(tabId, btnElement) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btnElement.classList.add('active');
            renderUI();
        }

        // نوێکردنەوەی زانیارییەکانی سەر شاشە
        function renderUI() {
            // پاشەکەوتکردن لە LocalStorage
            localStorage.setItem('sys_inventory', JSON.stringify(inventory));

            // نوێکردنەوەی خشتەی مخزن
            const list = document.getElementById('inventory-list');
            const select = document.getElementById('product-select');
            list.innerHTML = '';
            select.innerHTML = '<option value="">-- کاڵا هەڵبژێرە --</option>';

            let lowStockItems = [];

            inventory.forEach(item => {
                // تێکردن لە خشتە
                list.innerHTML += `
                    <tr>
                        <td><img src="${item.img}" class="product-img" onerror="this.src='https://via.placeholder.com/50'"></td>
                        <td>${item.name}</td>
                        <td>${item.qty}</td>
                    </tr>
                `;
                // تێکردن لە لیستەکەی شت هێنان
                select.innerHTML += `<option value="${item.id}">${item.name} (لە کۆگا: ${item.qty})</option>`;

                // پشکنین بۆ کاڵای کەم بووەوە
                if (item.qty <= 3) {
                    lowStockItems.push(item.name);
                }
            });

            // ئاگاداری کاڵای کەم
            const alertBox = document.getElementById('low-stock-alert');
            if(lowStockItems.length > 0) {
                alertBox.innerHTML = `<strong>پێشنیاری کڕین:</strong> بڕی ئەم کاڵایانە کەمە لە کۆگا: <span style="color:red;">${lowStockItems.join(', ')}</span>`;
            } else {
                alertBox.innerHTML = `<strong>پێشنیاری کڕین:</strong> سەرجەم کاڵاکان بە بڕی پێویست بەردەستن.`;
            }
        }

        // گەڕانی دوکاندار
        function filterSuppliers() {
            let filter = document.getElementById('supplier-search').value.toLowerCase();
            let select = document.getElementById('supplier-select');
            for (let option of select.options) {
                if (option.value === "") continue;
                option.style.display = option.text.toLowerCase().includes(filter) ? "" : "none";
            }
        }

        // زیادرکردنی بڕ لە بەشی شت هێنان
        function addStock() {
            let supplier = document.getElementById('supplier-select').value;
            let productId = parseInt(document.getElementById('product-select').value);
            let qty = parseInt(document.getElementById('purchase-qty').value);

            if (!supplier) { alert("تکایە پێشتر دوکاندار هەڵبژێرە!"); return; }
            if (!productId) { alert("تکایە کاڵا هەڵبژێرە!"); return; }
            if (qty <= 0) { alert("بڕی کاڵا دەبێت لە ٠ گەورەتر بێت!"); return; }

            let item = inventory.find(i => i.id === productId);
            if (item) {
                item.qty += qty;
                alert(`بڕی (${qty}) دانە بە سەرکەوتوویی بۆ (${item.name}) زیادکرا لە دوکانی [${supplier}]`);
                renderUI();
            }
        }

        // زیادکردنی کاڵای نوێ بۆ مخزن
        function addNewProduct() {
            let name = document.getElementById('new-item-name').value;
            let qty = parseInt(document.getElementById('new-item-qty').value);
            let img = document.getElementById('new-item-img').value || 'https://via.placeholder.com/50';

            if (!name) { alert("تکایە ناوی کاڵا بنووسە!"); return; }

            let newItem = {
                id: Date.now(),
                name: name,
                qty: qty || 0,
                img: img
            };

            inventory.push(newItem);
            document.getElementById('new-item-name').value = '';
            document.getElementById('new-item-qty').value = '0';
            document.getElementById('new-item-img').value = '';

            alert("کاڵای نوێ تۆمارکرا!");
            renderUI();
        }

        // باکەپ داگرتن (Download Backup)
        function downloadBackup() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(inventory));
            let downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `backup_inventory_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // گەڕاندنەوەی باکەپ (Restore Backup)
        function restoreBackup() {
            let fileInput = document.getElementById('restore-file');
            if (fileInput.files.length === 0) {
                alert("تکایە پێشتر فایلێکی باکەپ هەڵبژێرە!");
                return;
            }

            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let restoredData = JSON.parse(e.target.result);
                    if (Array.isArray(restoredData)) {
                        inventory = restoredData;
                        renderUI();
                        alert("زانیارییەکان بە سەرکەوتوویی گەڕێنرانەوە!");
                    } else {
                        alert("فایلی هەڵبژێردراو شیاو نییە.");
                    }
                } catch (err) {
                    alert("هەڵەیەک ڕوویدا لە خوێندنەوەی فایلەکە!");
                }
            };
            reader.readAsText(fileInput.files[0]);
        }

        // دەستپێکردنی سەرەتایی
        renderUI();
    </script>
</body>
</html>
